# ============================================================
#  QA Forge — Configuração Central do Pytest
# ============================================================

[pytest]
# ------------------------------------------------------------------
# Diretório raiz dos testes e padrões de descoberta
# ------------------------------------------------------------------
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ------------------------------------------------------------------
# Marcadores personalizados (evita PytestUnknownMarkWarning)
# ------------------------------------------------------------------
markers =
    api:       Testes de camada de API (Requests)
    web:       Testes de camada Web (Selenium)
    smoke:     Subconjunto rápido de verificação de sanidade
    regression: Suíte completa de regressão

# ------------------------------------------------------------------
# Relatório padrão no terminal: verbose + diff curto em falhas
# ------------------------------------------------------------------
addopts =
    -v
    --tb=short
    --strict-markers
    --html=reports/report.html
    --self-contained-html

# ------------------------------------------------------------------
# Variáveis de ambiente injetadas durante a execução dos testes
# ------------------------------------------------------------------
env =
    API_BASE_URL=https://petstore.swagger.io/v2
    WEB_BASE_URL=https://www.saucedemo.com
