# ============================================================
#  QA Forge — Pipeline de CI/CD (GitHub Actions)
#  Executa testes de API e Web em paralelo, publica relatório
#  HTML como artefato e tira screenshot em falhas Web.
# ============================================================

name: 🔬 QA Forge — Suíte de Testes

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  # Permite disparo manual pelo painel do GitHub
  workflow_dispatch:

# Cancela runs anteriores da mesma branch para economizar minutos
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  API_BASE_URL: "https://petstore.swagger.io/v2"
  WEB_BASE_URL: "https://www.saucedemo.com"
  HEADLESS: "true"   # Chrome sem interface gráfica em CI

jobs:
  # ----------------------------------------------------------------
  # Job 1 — Testes de API (rápido, sem Selenium)
  # ----------------------------------------------------------------
  testes-api:
    name: 🌐 API — Petstore
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔬 Executar testes de API
        run: |
          pytest -m api \
            --html=reports/api_report.html \
            --self-contained-html \
            -v

      - name: 📊 Publicar relatório de API
        if: always()   # publica mesmo em caso de falha
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-api-${{ github.run_number }}
          path: reports/api_report.html
          retention-days: 15

  # ----------------------------------------------------------------
  # Job 2 — Testes Web E2E (requer Chrome + Selenium)
  # ----------------------------------------------------------------
  testes-web:
    name: 🖥️ Web E2E — SauceDemo
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout do repositório
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: 📦 Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🌐 Instalar Chrome + ChromeDriver
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: 🔬 Executar testes Web
        run: |
          pytest -m web \
            --html=reports/web_report.html \
            --self-contained-html \
            -v

      - name: 📸 Publicar screenshots de falha
        if: failure()   # só publica se algum teste falhou
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-falha-${{ github.run_number }}
          path: reports/screenshots/
          retention-days: 7

      - name: 📊 Publicar relatório Web
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-web-${{ github.run_number }}
          path: reports/web_report.html
          retention-days: 15

  # ----------------------------------------------------------------
  # Job 3 — Publicação consolidada (depende dos dois anteriores)
  # ----------------------------------------------------------------
  relatorio-consolidado:
    name: 📋 Relatório Consolidado
    runs-on: ubuntu-latest
    needs: [testes-api, testes-web]
    if: always()

    steps:
      - name: ✅ Status final da suíte
        run: |
          echo "🔬 QA Forge — Pipeline concluído"
          echo "API:  ${{ needs.testes-api.result }}"
          echo "Web:  ${{ needs.testes-web.result }}"

          if [[ "${{ needs.testes-api.result }}" == "failure" || \
                "${{ needs.testes-web.result }}" == "failure" ]]; then
            echo "❌ Um ou mais jobs falharam."
            exit 1
          fi

          echo "✅ Todos os testes passaram com sucesso!"
